name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]   # the sources run as they are: Node's built-in TypeScript stripping, 22.18 or later
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm test
      - name: The command line works from a clone, with nothing installed
        run: |
          node src/cli.ts help
          node src/cli.ts check --config sample/config.example.json
          node src/cli.ts test --config sample/config.example.json --webhook sample/webhook.example.json | tee plan.txt
          grep -q 'would run  \[quarantine an IAM user\]' plan.txt
      - name: It will not serve without the webhook secret
        run: |
          if node src/cli.ts serve --config sample/config.example.json; then
            echo "served with no secret" >&2; exit 1
          fi
