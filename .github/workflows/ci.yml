name: CI
# Every action is pinned to a commit, with its version in the comment beside it, so a tag moved
# upstream cannot change what runs here. Dependabot proposes new pins (.github/dependabot.yml).
# Nothing here pushes to the repository, so checkout does not leave its token on disk.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]   # the sources run as they are: Node's built-in TypeScript stripping, 22.18 or later
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm test
      - name: The command line works from a clone, with nothing installed
        run: |
          node src/cli.ts help
          node src/cli.ts check --config sample/config.example.json
          node src/cli.ts test --config sample/config.example.json --webhook sample/webhook.example.json | tee plan.txt
          grep -q 'would run  \[quarantine an IAM user\]' plan.txt
      - name: It will not serve without the webhook secret
        run: |
          if node src/cli.ts serve --config sample/config.example.json; then
            echo "served with no secret" >&2; exit 1
          fi
